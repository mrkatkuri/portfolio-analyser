[project]
name = "portfolio-analyser"
version = "0.1.0"
description = "Transaction-based stock portfolio dashboard"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2", "pandas>=2.2,<4", "plotly>=5.24,<7", "yfinance>=0.2.54,<2", "openpyxl>=3.1,<4", "xlrd>=2,<3"]

[dependency-groups]
dev = ["pytest>=8,<10", "xlwt>=1.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
